name: Build and validate task Z3 dates
on:
  push:
    branches: [s7-z3-dates-minchul]
    paths:
      - 'pipeline/build_detail_dates.mjs'
      - 'pipeline/test_detail_dates.mjs'
      - 'pipeline/check_detail_dates*.py'
      - 'pipeline/check_contract.py'
      - '.github/workflows/build-z3-dates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy pyproj requests tifffile imagecodecs skyfield pytest
      - name: Boundary, half-day, clipping and exact-delta regressions
        run: |
          set -o pipefail
          mkdir -p docs/z3_checks
          node --test pipeline/test_detail_dates.mjs | tee docs/z3_checks/tests.txt
      - name: Generate all 33 sites from fresh core hourly classifications
        run: node pipeline/build_detail_dates.mjs
      - name: Full author aggregation and legacy regression checks
        run: python pipeline/check_detail_dates_run.py
      - name: Diagnose pre-existing exact-float coordinate failures
        run: |
          git fetch --depth=1 origin 300b8499e3ea4cadf1e9f2c36a267ba91e935aee
          python pipeline/check_local250_portability.py
          python -m pytest pipeline/test_local250_portability.py -q | tee docs/z3_checks/local250_tests.txt
      - name: Complete repository contract
        run: |
          set -o pipefail
          python pipeline/check_contract.py | tee docs/z3_checks/contract.txt
      - name: Verify protected products unchanged and record SI
        run: |
          python pipeline/publish_z3.py
          git diff --exit-code -- web/data/date_slip web/data/horizon web/data/metrics web/data/windows web/data/ephem.bin web/data/sites.json web/js/core.js
      - name: Commit generated products on task branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/detail/dates docs/z3_dates.md docs/z3_dates_generation.json docs/z3_dates_author_check.json docs/z3_checks docs/verification_ledger.md docs/SI_USAGE.md submission/checkin_update_2026-11-15_ko.md
          git commit -m "Generate complete Z3 exact-hour daily stays and signed slip changes for all 33 sites"
          git push origin HEAD:s7-z3-dates-minchul
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-z3-results
          retention-days: 30
          path: |
            docs/z3_dates*
            docs/z3_checks/
