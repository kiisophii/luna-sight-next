name: Independent task A horizons
on:
  push:
    branches: [s5-a-horizons-minchul]
    paths:
      - 'verification/task_a/**'
      - '.github/workflows/verify-task-a.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LLSN_VERIFICATION_ROOT: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
      LLSN_PREVIOUS_RUN_ID: '43649858746'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r verification/task_a/requirements-independent.txt
      - name: Independent analytic and isolation controls
        run: python -m unittest discover -s verification/task_a -p test_independent_geometry.py -v
      - name: Resume the 17 already completed independent site results
        uses: actions/download-artifact@v4
        with:
          name: task-a-horizons-full
          run-id: 43649858746
          github-token: ${{ github.token }}
          path: .
      - name: Recompute all 16 remaining polar sites at all 720 azimuths
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sites = json.load(open('web/data/sites.json'))
          command = [sys.executable, 'verification/task_a/verify_horizons_independent.py', '--run']
          selected = []
          for site in sites:
              h = json.load(open(Path('web/data/horizon') / (site['id'] + '.json')))
              if h['engine']['min_km'] == 0.005:
                  selected.append(site['id'])
                  command += ['--site', site['id']]
          assert len(selected) == 16
          print('Resuming the 17 completed non-polar sites; computing', selected, flush=True)
          subprocess.run(command, check=True)
          PY
      - name: Export all comparisons, including failures
        if: always()
        run: python verification/task_a/report_task_a.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-a-horizons-full
          retention-days: 7
          path: |
            docs/task_a_horizons/
            data/processed/task_a/*.json
      - name: Report completeness and numerical acceptance
        if: always()
        run: python -c "import json; s=json.load(open('docs/task_a_horizons/summary.json')); print(s); assert s['passed'], 'Incomplete run or reported numerical failures; inspect full artifact'"
